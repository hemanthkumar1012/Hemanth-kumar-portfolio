<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>V. Hemanth Kumar — Portfolio</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a12}iframe{display:block;width:100%;height:100%;border:0;background:#070a12}</style>
</head>
<body>
<iframe id="portfolioFrame" src="legacy.html" title="V. Hemanth Kumar Portfolio"></iframe>
<script>
(function(){
const frame=document.getElementById('portfolioFrame');
frame.addEventListener('load',()=>{
const w=frame.contentWindow,d=w.document;if(d.getElementById('immersiveExperience'))return;
const style=d.createElement('style');style.id='immersiveExperience';style.textContent=`
:root{--dive:cubic-bezier(.16,1,.3,1);--accent:#7c5cff;--accent2:#00d4ff;--pink:#ff4ecd;--line:rgba(255,255,255,.12);--glass:rgba(12,16,30,.72)}
html{scroll-behavior:smooth;scroll-padding-top:90px;background:#070a12}body{background:radial-gradient(circle at 50% -10%,rgba(124,92,255,.16),transparent 35%),#070a12!important;color:#f7f8ff!important;perspective:1400px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9997;background:radial-gradient(600px circle at var(--mx,50%) var(--my,20%),rgba(0,212,255,.10),transparent 42%),radial-gradient(500px circle at 80% 80%,rgba(255,78,205,.07),transparent 45%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9996;opacity:.045;background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
#readingProgress{position:fixed;top:0;left:0;width:100%;height:3px;z-index:10010;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent2),var(--pink));box-shadow:0 0 24px rgba(124,92,255,.7)}
#diveCursor{position:fixed;width:16px;height:16px;border:1px solid rgba(255,255,255,.7);border-radius:50%;pointer-events:none;z-index:10009;transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s,border .25s;box-shadow:0 0 24px rgba(0,212,255,.35)}#diveCursor:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--accent2)}body.cursor-active #diveCursor{width:48px;height:48px;background:rgba(124,92,255,.12);border-color:rgba(255,255,255,.45)}
#diveLabel{position:fixed;right:24px;bottom:28px;z-index:10000;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(9,13,25,.72);backdrop-filter:blur(18px);border:1px solid var(--line);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#dfe5ff;box-shadow:0 16px 45px rgba(0,0,0,.28);opacity:0;transform:translateY(12px);transition:.45s var(--dive)}#diveLabel.show{opacity:1;transform:none}#diveLabel i{width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 5px rgba(0,212,255,.12),0 0 16px var(--accent2)}
/* Preserve the existing content while giving it a cinematic visual system. */
nav,.nav,.navbar,header{backdrop-filter:blur(22px)!important;background:rgba(7,10,18,.68)!important;border-color:var(--line)!important;z-index:1000}
section{position:relative;isolation:isolate;transform-style:preserve-3d;background:transparent!important}section:before{content:"";position:absolute;inset:8% -12%;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 50% 50%,rgba(124,92,255,.055),transparent 65%);filter:blur(12px)}section:after{content:"";position:absolute;left:50%;bottom:0;width:min(900px,72%);height:1px;background:linear-gradient(90deg,transparent,rgba(124,92,255,.32),rgba(0,212,255,.25),transparent);transform:translateX(-50%);opacity:.7}section:last-of-type:after{display:none}
.dive-section{opacity:0;transform:translateY(90px) scale(.94) rotateX(2deg);transition:opacity 1s var(--dive),transform 1.15s var(--dive)}.dive-section.visible{opacity:1;transform:none}
.card{position:relative;overflow:hidden;transform-style:preserve-3d;transition:transform .55s var(--dive),box-shadow .55s var(--dive),border-color .4s}.card:before{content:"";position:absolute;inset:-2px;pointer-events:none;background:radial-gradient(420px circle at var(--cx,50%) var(--cy,50%),rgba(0,212,255,.16),transparent 38%);opacity:0;transition:.35s}.card:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08) 48%,transparent 64%);transform:translateX(-130%);transition:transform .8s var(--dive)}.card:hover:before{opacity:1}.card:hover:after{transform:translateX(130%)}.card:hover{transform:translateY(-10px) rotateX(1deg);box-shadow:0 30px 80px rgba(0,0,0,.28),0 0 0 1px rgba(124,92,255,.16)!important}.card>*{position:relative;z-index:1}
.project-number{position:absolute!important;top:12px;right:22px;font-size:72px;line-height:1;font-weight:900;letter-spacing:-7px;color:rgba(255,255,255,.055);pointer-events:none!important;z-index:0!important}.deep-dive{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 15px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:linear-gradient(135deg,var(--accent),#5b7cff);color:#fff;font:800 12px -apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif;cursor:pointer;transition:.3s var(--dive);box-shadow:0 8px 25px rgba(124,92,255,.2)}.deep-dive:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 14px 35px rgba(124,92,255,.35)}
.chip{transition:transform .25s var(--dive),box-shadow .25s}.chip:hover{box-shadow:0 10px 30px rgba(0,212,255,.16)!important}
#projectDive{position:fixed;inset:0;z-index:10020;display:none;overflow:auto;background:radial-gradient(circle at 15% 10%,rgba(124,92,255,.18),transparent 32%),radial-gradient(circle at 85% 80%,rgba(255,78,205,.10),transparent 30%),rgba(5,8,16,.96);backdrop-filter:blur(28px);opacity:0;color:#f7f8ff}#projectDive.open{display:block;animation:diveOpen .55s var(--dive) forwards}@keyframes diveOpen{to{opacity:1}}
.dive-inner{max-width:1120px;min-height:100%;margin:auto;padding:100px 28px 90px}.dive-close{position:fixed;top:22px;right:24px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(15,20,36,.8);color:#fff;font-size:22px;cursor:pointer;z-index:3;transition:.25s}.dive-close:hover{transform:rotate(90deg) scale(1.05);border-color:rgba(0,212,255,.5)}.dive-kicker{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2)}.dive-title{font-size:clamp(48px,8vw,94px);line-height:.95;letter-spacing:-5px;margin:10px 0 20px;background:linear-gradient(100deg,#fff 20%,#b9b4ff 55%,#7eeeff);-webkit-background-clip:text;background-clip:text;color:transparent}.dive-status{font-size:15px;color:#aeb7d0;max-width:780px}.dive-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:24px;margin-top:58px}.dive-panel{background:linear-gradient(145deg,rgba(20,27,48,.82),rgba(10,14,26,.72));border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 24px 80px rgba(0,0,0,.3);position:relative;overflow:hidden}.dive-panel:before{content:"";position:absolute;width:180px;height:180px;right:-90px;top:-90px;border-radius:50%;background:rgba(0,212,255,.1);filter:blur(4px)}.dive-panel h4{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#8e9ab7;margin-bottom:18px}.dive-list{display:grid;gap:15px;list-style:none;padding:0}.dive-list li{color:#c1c9dc;font-size:15px;line-height:1.65;padding-left:22px;position:relative}.dive-list li:before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 5px rgba(0,212,255,.08),0 0 14px rgba(0,212,255,.45)}.dive-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.dive-actions a{display:inline-flex;padding:11px 16px;border-radius:999px;background:linear-gradient(135deg,var(--accent),#5b7cff);color:#fff;font-size:13px;font-weight:800}.dive-actions a.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--line)}.dive-reveal{opacity:0;transform:translateY(28px);animation:reveal .75s var(--dive) forwards}.dive-reveal:nth-child(2){animation-delay:.08s}.dive-reveal:nth-child(3){animation-delay:.16s}@keyframes reveal{to{opacity:1;transform:none}}
/* Dynamic ambient orbs */
#ambientOrbs{position:fixed;inset:0;pointer-events:none;z-index:9995;overflow:hidden}#ambientOrbs span{position:absolute;width:240px;height:240px;border-radius:50%;filter:blur(55px);opacity:.11;mix-blend-mode:screen;animation:orbFloat 14s ease-in-out infinite alternate}#ambientOrbs span:nth-child(1){left:-70px;top:18%;background:#7c5cff}#ambientOrbs span:nth-child(2){right:-80px;top:42%;background:#00d4ff;animation-delay:-4s}#ambientOrbs span:nth-child(3){left:35%;bottom:-120px;background:#ff4ecd;animation-delay:-8s}@keyframes orbFloat{to{transform:translate3d(80px,-55px,0) scale(1.18)}}
@media(max-width:760px){#diveCursor{display:none}.dive-grid{grid-template-columns:1fr}.dive-inner{padding:90px 18px 70px}.dive-title{letter-spacing:-3px}.project-number{font-size:48px;right:18px}#diveLabel{right:14px;bottom:14px}}
@media(prefers-reduced-motion:reduce){body:before,body:after,#diveCursor,#diveLabel,#ambientOrbs{display:none!important}.dive-section{opacity:1;transform:none;transition:none}.dive-reveal{opacity:1;transform:none;animation:none}.card:hover{transform:none}}
`;
d.head.appendChild(style);
d.body.insertAdjacentHTML('afterbegin','<div id="ambientOrbs"><span></span><span></span><span></span></div><div id="readingProgress"></div><div id="diveCursor"></div><div id="diveLabel"><i></i><span>Scroll to explore</span></div>');
const cursor=d.getElementById('diveCursor'),progress=d.getElementById('readingProgress'),label=d.getElementById('diveLabel');
const sections=[...d.querySelectorAll('main section')];sections.forEach(s=>s.classList.add('dive-section'));
const io=new w.IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.1,rootMargin:'0px 0px -7% 0px'});sections.forEach(s=>io.observe(s));
w.addEventListener('pointermove',e=>{d.documentElement.style.setProperty('--mx',e.clientX+'px');d.documentElement.style.setProperty('--my',e.clientY+'px');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
d.querySelectorAll('a,button,.card,.chip').forEach(x=>{x.addEventListener('mouseenter',()=>d.body.classList.add('cursor-active'));x.addEventListener('mouseleave',()=>d.body.classList.remove('cursor-active'))});
function scrollFX(){const max=d.documentElement.scrollHeight-w.innerHeight;progress.style.transform='scaleX('+(max>0?w.scrollY/max:0)+')';label.classList.toggle('show',w.scrollY>220);sections.forEach((s,i)=>{const r=s.getBoundingClientRect(),h=s.querySelector('.section-head');if(h){const delta=(r.top+r.height/2-w.innerHeight/2)/w.innerHeight;h.style.transform='translate3d(0,'+(-delta*16)+'px,0)'}s.style.setProperty('--scroll-depth',Math.max(-1,Math.min(1,delta)))})}
w.addEventListener('scroll',scrollFX,{passive:true});scrollFX();
d.querySelectorAll('.chip').forEach(chip=>{chip.addEventListener('pointermove',e=>{const r=chip.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;chip.style.transform='translateY(-5px) rotateX('+(-y*8)+'deg) rotateY('+(x*10)+'deg)'});chip.addEventListener('pointerleave',()=>chip.style.transform='')});
const cards=[...d.querySelectorAll('.card')].filter(c=>/GitHub|Live Demo/i.test(c.textContent));
cards.forEach((card,i)=>{card.style.setProperty('--cx','50%');card.style.setProperty('--cy','50%');card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--cx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--cy',((e.clientY-r.top)/r.height*100)+'%')});if(!card.querySelector('.project-number'))card.insertAdjacentHTML('beforeend','<span class="project-number">0'+(i+1)+'</span>');const head=card.querySelector('.card-head');if(head&&!head.querySelector('.deep-dive')){const b=d.createElement('button');b.className='deep-dive';b.type='button';b.innerHTML='Enter project <span>↗</span>';head.appendChild(b);b.addEventListener('click',e=>{e.stopPropagation();openDive(card)})}});
function text(el){return el?el.innerText.trim():''}function openDive(card){let o=d.getElementById('projectDive');if(!o){o=d.createElement('div');o.id='projectDive';d.body.appendChild(o)}const title=text(card.querySelector('h3'))||'Project',status=text(card.querySelector('.meta')),bullets=[...card.querySelectorAll('li')].map(text).filter(Boolean),stack=text(card.querySelector('.stack')),links=[...card.querySelectorAll('a')].filter(a=>a.href&&a.getAttribute('href')!=='#'),actions=links.map(a=>'<a class="'+(/github/i.test(a.textContent)?'secondary':'')+'" target="_blank" rel="noopener" href="'+a.href+'">'+text(a)+' ↗</a>').join('');o.innerHTML='<button class="dive-close" aria-label="Close project">×</button><div class="dive-inner"><div class="dive-kicker dive-reveal">Project deep dive</div><h2 class="dive-title dive-reveal">'+title+'</h2><p class="dive-status dive-reveal">'+status+'</p><div class="dive-grid"><div class="dive-panel dive-reveal"><h4>What I built</h4><ul class="dive-list">'+bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul></div><div class="dive-panel dive-reveal"><h4>Technology & access</h4><p style="color:#aeb7d0;font-size:15px;line-height:1.7">'+stack+'</p><div class="dive-actions">'+actions+'</div></div></div></div>';o.classList.add('open');d.body.style.overflow='hidden';o.querySelector('.dive-close').onclick=close;d.onkeydown=e=>{if(e.key==='Escape')close()};o.onclick=e=>{if(e.target===o)close()}}
function close(){const o=d.getElementById('projectDive');if(o)o.classList.remove('open');d.body.style.overflow='';d.onkeydown=null}
});})();
</script>
</body>
</html>
