<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>V. Hemanth Kumar — Portfolio</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f5f7}
iframe{display:block;width:100%;height:100%;border:0;background:#f5f5f7}
</style>
</head>
<body>
<iframe id="portfolioFrame" src="legacy.html" title="V. Hemanth Kumar Portfolio"></iframe>
<script>
(function(){
const frame=document.getElementById('portfolioFrame');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=w.document;
  if(d.getElementById('immersiveExperience'))return;
  const style=d.createElement('style');style.id='immersiveExperience';style.textContent=`
  :root{--dive:cubic-bezier(.16,1,.3,1);--line:rgba(29,29,31,.09)}
  html{scroll-behavior:smooth;scroll-padding-top:90px}
  body{perspective:1200px}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(0,113,227,.08),transparent 24%);transition:background .15s ease}
  #readingProgress{position:fixed;top:0;left:0;width:100%;height:3px;z-index:10001;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#0071e3,#8b5cf6,#ec4899);box-shadow:0 0 18px rgba(0,113,227,.35)}
  #diveCursor{position:fixed;width:18px;height:18px;border:1px solid rgba(0,113,227,.55);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);transition:.2s;mix-blend-mode:multiply}
  body.cursor-active #diveCursor{width:42px;height:42px;background:rgba(0,113,227,.08);border-color:rgba(0,113,227,.25)}
  #diveLabel{position:fixed;right:24px;bottom:28px;z-index:9997;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);box-shadow:0 12px 30px rgba(0,0,0,.08);opacity:0;transform:translateY(12px);transition:.4s var(--dive)}
  #diveLabel.show{opacity:1;transform:none}#diveLabel i{width:6px;height:6px;border-radius:50%;background:#0071e3;box-shadow:0 0 0 5px rgba(0,113,227,.1)}
  section{position:relative;isolation:isolate;transform-style:preserve-3d}
  section:after{content:"";position:absolute;left:50%;bottom:0;width:min(760px,70%);height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);transform:translateX(-50%)}section:last-of-type:after{display:none}
  .dive-section{opacity:0;transform:translateY(70px) scale(.97);transition:opacity 1s var(--dive),transform 1s var(--dive)}.dive-section.visible{opacity:1;transform:none}
  .card{position:relative;overflow:hidden;transform-style:preserve-3d}.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--cx,50%) var(--cy,50%),rgba(0,113,227,.11),transparent 30%);opacity:0;transition:.3s}.card:hover:before{opacity:1}.card>*{position:relative;z-index:1}
  .project-number{position:absolute!important;top:18px;right:24px;font-size:52px;line-height:1;font-weight:800;letter-spacing:-4px;color:rgba(29,29,31,.045);pointer-events:none!important;z-index:0!important}
  .deep-dive{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:9px 14px;border:0;border-radius:999px;background:#1d1d1f;color:#fff;font:700 12px -apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',Arial,sans-serif;cursor:pointer;transition:.25s var(--dive)}.deep-dive:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.16)}
  #projectDive{position:fixed;inset:0;z-index:10002;display:none;overflow:auto;background:rgba(245,245,247,.96);backdrop-filter:blur(24px);opacity:0}#projectDive.open{display:block;animation:diveOpen .5s var(--dive) forwards}@keyframes diveOpen{to{opacity:1}}
  .dive-inner{max-width:1080px;min-height:100%;margin:auto;padding:100px 28px 90px}.dive-close{position:fixed;top:22px;right:24px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.85);font-size:22px;cursor:pointer;z-index:3}.dive-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0071e3}.dive-title{font-size:clamp(44px,8vw,88px);line-height:.98;letter-spacing:-4px;margin:10px 0 20px}.dive-status{font-size:15px;color:var(--dim);max-width:760px}.dive-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:26px;margin-top:60px}.dive-panel{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.06)}.dive-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:18px}.dive-list{display:grid;gap:14px;list-style:none;padding:0}.dive-list li{color:var(--dim);font-size:15px;padding-left:22px;position:relative}.dive-list li:before{content:"";position:absolute;left:0;top:.65em;width:7px;height:7px;border-radius:50%;background:#0071e3;box-shadow:0 0 0 5px rgba(0,113,227,.08)}.dive-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.dive-actions a{display:inline-flex;padding:11px 16px;border-radius:999px;background:#0071e3;color:#fff;font-size:13px;font-weight:700}.dive-actions a.secondary{background:#fff;color:#1d1d1f;border:1px solid var(--line)}.dive-reveal{opacity:0;transform:translateY(24px);animation:reveal .7s var(--dive) forwards}.dive-reveal:nth-child(2){animation-delay:.08s}.dive-reveal:nth-child(3){animation-delay:.16s}@keyframes reveal{to{opacity:1;transform:none}}
  @media(max-width:760px){#diveCursor{display:none}#diveLabel{right:14px;bottom:14px}.dive-grid{grid-template-columns:1fr}.dive-inner{padding:90px 18px 70px}.dive-title{letter-spacing:-2px}.project-number{font-size:38px;right:18px}}
  @media(prefers-reduced-motion:reduce){body:before,#diveCursor,#diveLabel{display:none!important}.dive-section{opacity:1;transform:none;transition:none}.dive-reveal{opacity:1;transform:none;animation:none}}
  `;d.head.appendChild(style);
  d.body.insertAdjacentHTML('afterbegin','<div id="readingProgress"></div><div id="diveCursor"></div><div id="diveLabel"><i></i><span>Scroll to explore</span></div>');
  const cursor=d.getElementById('diveCursor'),progress=d.getElementById('readingProgress'),label=d.getElementById('diveLabel');
  const sections=[...d.querySelectorAll('main section')];sections.forEach(s=>s.classList.add('dive-section'));
  const io=new w.IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.12,rootMargin:'0px 0px -8% 0px'});sections.forEach(s=>io.observe(s));
  w.addEventListener('pointermove',e=>{d.documentElement.style.setProperty('--mx',e.clientX+'px');d.documentElement.style.setProperty('--my',e.clientY+'px');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px'});
  d.querySelectorAll('a,button,.card,.chip').forEach(x=>{x.addEventListener('mouseenter',()=>d.body.classList.add('cursor-active'));x.addEventListener('mouseleave',()=>d.body.classList.remove('cursor-active'))});
  function scrollFX(){const max=d.documentElement.scrollHeight-w.innerHeight;progress.style.transform='scaleX('+(max>0?w.scrollY/max:0)+')';label.classList.toggle('show',w.scrollY>220);sections.forEach(s=>{const r=s.getBoundingClientRect(),h=d.querySelector('.section-head',s);if(h){const delta=(r.top+r.height/2-w.innerHeight/2)/w.innerHeight;h.style.transform='translate3d(0,'+(-delta*12)+'px,0)'}})}
  w.addEventListener('scroll',scrollFX,{passive:true});scrollFX();
  d.querySelectorAll('.chip').forEach(chip=>{chip.addEventListener('pointermove',e=>{const r=chip.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;chip.style.transform='translateY(-4px) rotateX('+(-y*7)+'deg) rotateY('+(x*9)+'deg)'});chip.addEventListener('pointerleave',()=>chip.style.transform='')});
  const cards=[...d.querySelectorAll('.card')].filter(c=>/GitHub|Live Demo/i.test(c.textContent));
  cards.forEach((card,i)=>{card.style.setProperty('--cx','50%');card.style.setProperty('--cy','50%');card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--cx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--cy',((e.clientY-r.top)/r.height*100)+'%')});if(!card.querySelector('.project-number'))card.insertAdjacentHTML('beforeend','<span class="project-number">0'+(i+1)+'</span>');const head=card.querySelector('.card-head');if(head&&!head.querySelector('.deep-dive')){const b=d.createElement('button');b.className='deep-dive';b.type='button';b.innerHTML='Enter project <span>↗</span>';head.appendChild(b);b.addEventListener('click',e=>{e.stopPropagation();openDive(card)})}});
  function text(el){return el?el.innerText.trim():''}
  function openDive(card){let o=d.getElementById('projectDive');if(!o){o=d.createElement('div');o.id='projectDive';d.body.appendChild(o)}const title=text(card.querySelector('h3'))||'Project';const status=text(card.querySelector('.meta'));const bullets=[...card.querySelectorAll('li')].map(text).filter(Boolean);const stack=text(card.querySelector('.stack'));const links=[...card.querySelectorAll('a')].filter(a=>a.href&&a.getAttribute('href')!=='#');const actions=links.map(a=>'<a class="'+(/github/i.test(a.textContent)?'secondary':'')+'" target="_blank" rel="noopener" href="'+a.href+'">'+text(a)+' ↗</a>').join('');o.innerHTML='<button class="dive-close" aria-label="Close project">×</button><div class="dive-inner"><div class="dive-kicker dive-reveal">Project deep dive</div><h2 class="dive-title dive-reveal">'+title+'</h2><p class="dive-status dive-reveal">'+status+'</p><div class="dive-grid"><div class="dive-panel dive-reveal"><h4>What I built</h4><ul class="dive-list">'+bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul></div><div class="dive-panel dive-reveal"><h4>Technology & access</h4><p style="color:var(--dim);font-size:15px;line-height:1.7">'+stack+'</p><div class="dive-actions">'+actions+'</div></div></div></div>';o.classList.add('open');d.body.style.overflow='hidden';o.querySelector('.dive-close').onclick=close;d.onkeydown=e=>{if(e.key==='Escape')close()};o.onclick=e=>{if(e.target===o)close()}}
  function close(){const o=d.getElementById('projectDive');if(o)o.classList.remove('open');d.body.style.overflow='';d.onkeydown=null}
});
})();
</script>
</body>
</html>
