X-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;ch.style.transform='translateY(-4px) rotateX('+(-y*7)+'deg) rotateY('+(x*9)+'deg)'});ch.addEventListener('pointerleave',()=>ch.style.transform='')});const cards=[...d.querySelectorAll('.card')].filter(x=>/GitHub|Live Demo/i.test(x.textContent));cards.forEach((card,i)=>{card.style.setProperty('--cx','50%');card.style.setProperty('--cy','50%');card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--cx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--cy',((e.clientY-r.top)/r.height*100)+'%')});if(!card.querySelector('.project-number'))card.insertAdjacentHTML('beforeend','<span class="project-number">0'+(i+1)+'</span>');const h=card.querySelector('.card-head');if(h&&!h.querySelector('.deep-dive')){const b=d.createElement('button');b.className='deep-dive';b.type='button';b.innerHTML='Explore project <span>↗</span>';h.appendChild(b);b.addEventListener('click',e=>{e.stopPropagation();openDive(card)})}});function t(e){return e?e.innerText.trim():''}function openDive(card){let o=d.getElementById('projectDive');if(!o){o=d.createElement('div');o.id='projectDive';d.body.appendChild(o)}const title=t(card.querySelector('h3'))||'Project',status=t(card.querySelector('.meta')),bullets=[...card.querySelectorAll('li')].map(t).filter(Boolean),stack=t(card.querySelector('.stack')),links=[...card.querySelectorAll('a')].filter(a=>a.href&&a.getAttribute('href')!=='#'),actions=links.map(a=>'<a class="'+(/github/i.test(a.textContent)?'secondary':'')+'" target="_blank" rel="noopener" href="'+a.href+'">'+t(a)+' ↗</a>').join('');o.innerHTML='<button class="dive-close" aria-label="Close project">×</button><div class="dive-inner"><div class="dive-kicker dive-reveal">Project deep dive</div><h2 class="dive-title dive-reveal">'+title+'</h2><p class="dive-status dive-reveal">'+status+'</p><div class="dive-grid"><div class="dive-panel dive-reveal"><h4>What I built</h4><ul class="dive-lis
