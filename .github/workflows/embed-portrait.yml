name: Embed portrait asset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  embed:
    if: github.event.head_commit.message != 'Embed Hemanth portrait asset'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed portrait into portfolio
        run: |
          cat .github/portrait/part1.txt .github/portrait/part2.txt .github/portrait/part3.txt > /tmp/portrait.b64
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '__IMAGE_B64__'
          b64 = Path('/tmp/portrait.b64').read_text().strip()
          replacement = b64
          if marker not in s:
              raise SystemExit('portrait marker not found')
          p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
          rm -rf .github/portrait .github/workflows/embed-portrait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github
          git commit -m 'Embed Hemanth portrait asset'
          git push
