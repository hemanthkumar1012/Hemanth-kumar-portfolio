name: Upgrade portfolio experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upgrade portfolio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* IMMERSIVE_PORTFOLIO_V2 */'
          if marker in text:
              print('Immersive upgrade already present; nothing to do.')
              raise SystemExit(0)

          css = r'''\n/* IMMERSIVE_PORTFOLIO_V2 */
:root{--dive-ease:cubic-bezier(.16,1,.3,1);--dive-line:rgba(29,29,31,.09)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{perspective:1200px}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(0,113,227,.08),transparent 24%);mix-blend-mode:multiply;transition:background .15s ease}
#readingProgress{position:fixed;top:0;left:0;width:100%;height:3px;z-index:10001;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#0071e3,#8b5cf6,#ec4899);box-shadow:0 0 18px rgba(0,113,227,.35)}
#diveCursor{position:fixed;width:18px;height:18px;border:1px solid rgba(0,113,227,.55);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);transition:width .2s,height .2s,background .2s,border-color .2s;mix-blend-mode:multiply}
body.cursor-active #diveCursor{width:42px;height:42px;background:rgba(0,113,227,.08);border-color:rgba(0,113,227,.25)}
.dive-label{position:fixed;right:24px;bottom:28px;z-index:9997;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid var(--dive-line);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);box-shadow:0 12px 30px rgba(0,0,0,.08);opacity:0;transform:translateY(12px);transition:.4s var(--dive-ease)}
.dive-label.show{opacity:1;transform:none}.dive-dot{width:6px;height:6px;border-radius:50%;background:#0071e3;box-shadow:0 0 0 5px rgba(0,113,227,.1)}
section{position:relative;isolation:isolate;transform-style:preserve-3d}
section:after{content:"";position:absolute;left:50%;bottom:0;width:min(760px,70%);height:1px;background:linear-gradient(90deg,transparent,var(--dive-line),transparent);transform:translateX(-50%);opacity:.7}
section:last-of-type:after{display:none}
.section-head,.about-text,.skills-groups,.timeline,.card,.contact-card{will-change:transform}
.card{position:relative;overflow:hidden;transform-style:preserve-3d}
.card:before{content:"";position:absolute;inset:-1px;pointer-events:none;background:radial-gradient(circle at var(--card-x,50%) var(--card-y,50%),rgba(0,113,227,.10),transparent 28%);opacity:0;transition:opacity .35s ease}
.card:hover:before{opacity:1}
.card>*{position:relative;z-index:1}
.project-deep-dive{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.02em;color:#fff;background:#1d1d1f;padding:9px 14px;border-radius:999px;transition:.25s var(--dive-ease)}
.project-deep-dive:hover{transform:translateY(-2px);background:#000;box-shadow:0 10px 22px rgba(0,0,0,.16)}
.project-number{position:absolute;top:20px;right:24px;font-size:52px;line-height:1;font-weight:800;letter-spacing:-4px;color:rgba(29,29,31,.045);pointer-events:none}
#deepDive{position:fixed;inset:0;z-index:10002;display:none;overflow:auto;background:rgba(245,245,247,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0}
#deepDive.open{display:block;animation:diveIn .55s var(--dive-ease) forwards}
@keyframes diveIn{to{opacity:1}}
.deep-inner{min-height:100%;max-width:1080px;margin:0 auto;padding:100px 28px 90px}
.deep-close{position:fixed;top:22px;right:24px;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.82);border:1px solid var(--dive-line);font-size:22px;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.deep-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0071e3}
.deep-title{font-size:clamp(44px,8vw,88px);line-height:.98;letter-spacing:-4px;margin:10px 0 20px;max-width:900px}
.deep-status{font-size:15px;color:var(--dim);max-width:720px}
.deep-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:26px;margin-top:60px}
.deep-panel{background:rgba(255,255,255,.84);border:1px solid var(--dive-line);border-radius:28px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.06)}
.deep-panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:18px}
.deep-list{display:grid;gap:14px;padding:0;list-style:none}.deep-list li{color:var(--dim);font-size:15px;padding-left:22px;position:relative}.deep-list li:before{content:"";position:absolute;left:0;top:.65em;width:7px;height:7px;border-radius:50%;background:#0071e3;box-shadow:0 0 0 5px rgba(0,113,227,.08)}
.deep-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.deep-actions a{display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:999px;background:#0071e3;color:#fff;font-size:13px;font-weight:700}.deep-actions a.secondary{background:#fff;color:#1d1d1f;border:1px solid var(--dive-line)}
.deep-reveal{opacity:0;transform:translateY(24px);animation:deepReveal .7s var(--dive-ease) forwards}.deep-reveal:nth-child(2){animation-delay:.08s}.deep-reveal:nth-child(3){animation-delay:.16s}
@keyframes deepReveal{to{opacity:1;transform:none}}
.dive-section{opacity:0;transform:translateY(70px) scale(.97);transition:opacity 1s var(--dive-ease),transform 1s var(--dive-ease)}
.dive-section.dive-visible{opacity:1;transform:none}
.skills-groups .chip{will-change:transform}
@media(max-width:760px){#diveCursor{display:none}.dive-label{right:14px;bottom:14px}.deep-grid{grid-template-columns:1fr}.deep-inner{padding:90px 18px 70px}.deep-title{letter-spacing:-2px}.project-number{font-size:38px;right:18px}}
@media(prefers-reduced-motion:reduce){body:before,#diveCursor,.dive-label{display:none!important}.dive-section{opacity:1;transform:none;transition:none}.deep-reveal{opacity:1;transform:none;animation:none}}
'''

          js = r'''\n/* IMMERSIVE_PORTFOLIO_V2_RUNTIME */
(function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const app=$('#app'); if(!app) return;
  document.body.insertAdjacentHTML('afterbegin','<div id="readingProgress"></div><div id="diveCursor"></div><div class="dive-label" id="diveLabel"><span class="dive-dot"></span><span id="diveText">Scroll to explore</span></div>');
  const cursor=$('#diveCursor');
  window.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';});
  $$('a,button,.card,.chip').forEach(el=>{el.addEventListener('mouseenter',()=>document.body.classList.add('cursor-active'));el.addEventListener('mouseleave',()=>document.body.classList.remove('cursor-active'));});

  const sections=$$('main section');
  sections.forEach((s,i)=>{s.classList.add('dive-section');s.dataset.dive=i+1;});
  const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('dive-visible')}),{threshold:.12,rootMargin:'0px 0px -8% 0px'});
  sections.forEach(s=>observer.observe(s));

  const progress=$('#readingProgress'), label=$('#diveLabel'), diveText=$('#diveText');
  function scrollFX(){
    const max=document.documentElement.scrollHeight-innerHeight;
    progress.style.transform='scaleX('+(max>0?scrollY/max:0)+')';
    label.classList.toggle('show',scrollY>220);
    const current=sections.find(s=>{const r=s.getBoundingClientRect();return r.top<=innerHeight*.35&&r.bottom>innerHeight*.35});
    if(current){const title=$('.section-title',current);diveText.textContent=title?title.textContent:'Keep exploring';}
  }
  addEventListener('scroll',scrollFX,{passive:true}); scrollFX();

  // Subtle depth: elements move differently as the user dives through the page.
  function depth(){
    $$('section').forEach((s)=>{const r=s.getBoundingClientRect();const center=innerHeight/2;const delta=(r.top+r.height/2-center)/innerHeight;const head=$('.section-head',s);if(head)head.style.transform='translate3d(0,'+(delta*-12)+'px,0)';});
  }
  addEventListener('scroll',depth,{passive:true}); depth();

  // Give skill chips a responsive physical feel without changing their content.
  $$('.chip').forEach((chip,i)=>{chip.addEventListener('pointermove',e=>{const r=chip.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5;const y=(e.clientY-r.top)/r.height-.5;chip.style.transform='translateY(-4px) rotateX('+(-y*7)+'deg) rotateY('+(x*9)+'deg)';});chip.addEventListener('pointerleave',()=>chip.style.transform='');});

  // Project cards become entry points into individual case-study experiences.
  const cards=$$('.card');
  const projectCards=cards.filter(c=>/github|demo|project/i.test(c.textContent));
  projectCards.forEach((card,i)=>{
    const head=$('.card-head',card); if(!head)return;
    card.style.setProperty('--card-x','50%');card.style.setProperty('--card-y','50%');
    card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;card.style.setProperty('--card-x',x+'%');card.style.setProperty('--card-y',y+'%');});
    const title=$('h3',card)?.textContent?.trim()||('Project '+(i+1));
    if(!$('.project-number',card))card.insertAdjacentHTML('beforeend','<span class="project-number">0'+(i+1)+'</span>');
    if(!$('.project-deep-dive',card))head.insertAdjacentHTML('beforeend','<button class="project-deep-dive" type="button">Enter project <span>↗</span></button>');
    $('.project-deep-dive',card).addEventListener('click',e=>{e.stopPropagation();openDive(card,title);});
  });

  function cleanText(el){return el?el.innerText.trim():''}
  function openDive(card,title){
    const status=cleanText($('.meta',card));
    const bullets=$$('li',card).map(x=>x.innerText.trim()).filter(Boolean);
    const stack=cleanText($('.stack',card));
    const links=$$('a',card).filter(a=>a.href&&a.href!=='#');
    const actions=links.map(a=>'<a class="'+(/github/i.test(a.textContent)?'secondary':'')+'" target="_blank" rel="noopener" href="'+a.href+'">'+a.textContent.trim()+' ↗</a>').join('');
    let overlay=$('#deepDive');
    if(!overlay){overlay=document.createElement('div');overlay.id='deepDive';document.body.appendChild(overlay);}
    overlay.innerHTML='<button class="deep-close" aria-label="Close project">×</button><div class="deep-inner"><div class="deep-kicker deep-reveal">Project deep dive</div><h2 class="deep-title deep-reveal">'+title+'</h2><p class="deep-status deep-reveal">'+status+'</p><div class="deep-grid"><div class="deep-panel deep-reveal"><h4>What I built</h4><ul class="deep-list">'+bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul></div><div class="deep-panel deep-reveal"><h4>Technology & access</h4><p style="color:var(--dim);font-size:15px;line-height:1.7">'+stack+'</p><div class="deep-actions">'+actions+'</div></div></div></div>';
    overlay.classList.add('open');document.body.style.overflow='hidden';
    $('.deep-close',overlay).onclick=closeDive;
    overlay.onclick=e=>{if(e.target===overlay)closeDive()};
    document.onkeydown=e=>{if(e.key==='Escape')closeDive()};
  }
  function closeDive(){const o=$('#deepDive');if(o)o.classList.remove('open');document.body.style.overflow='';document.onkeydown=null;}

  // Turn ordinary navigation buttons into a smooth chapter system.
  $$('.nav-links button').forEach(btn=>btn.addEventListener('click',()=>{setTimeout(scrollFX,80)}));
})();
'''

          # Insert CSS before </style> and runtime before the final </script>.
          text=text.replace('</style>',css+'\n</style>',1)
          pos=text.rfind('</script>')
          if pos<0: raise SystemExit('Could not locate final script tag.')
          text=text[:pos]+js+'\n'+text[pos:]
          path.write_text(text,encoding='utf-8')
          print('Immersive portfolio upgrade injected successfully.')
          PY

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Create immersive project deep-dive portfolio experience" || exit 0
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/upgrade-portfolio-experience.yml || true
          git commit -m "Remove temporary portfolio upgrade workflow" || true
          git push || true
