name: Redesign portfolio experience
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  redesign:
    if: github.event.head_commit.message != 'Apply Arturo-inspired portfolio redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply editorial redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* ART-DIRECTION REDESIGN — editorial, minimal, interaction-led */
          :root{--bg:#f5f5f1;--ink:#111;--muted:#777;--line:#d8d8d2;--blue:#1468e8;--green:#18d66a;--max:1320px}
          html{scroll-behavior:smooth;background:var(--bg)}
          body{background:var(--bg);font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink);cursor:default}
          body:before{background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:100% 180px;mask-image:linear-gradient(#000,transparent 78%)}
          .page{width:min(var(--max),calc(100% - 96px))}
          nav{height:86px;background:rgba(245,245,241,.88);backdrop-filter:blur(20px);border-bottom:1px solid transparent}
          .nav{max-width:var(--max);position:relative}
          .logo{font-size:23px;letter-spacing:-2px;font-weight:900}
          .links{gap:28px;margin-left:0;position:absolute;left:50%;transform:translateX(-50%)}
          .links a{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#666;padding:8px 0}
          .links a:after{height:1px;bottom:1px;background:#111}
          .connect{font-size:11px;letter-spacing:.04em;padding:13px 18px;background:#111;box-shadow:none}
          .hero{min-height:calc(100vh - 86px);height:auto;padding-top:86px;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(430px,.98fr);align-items:center;gap:55px;overflow:hidden}
          .copy{padding:85px 0 90px;max-width:690px;z-index:5}
          .available{padding:0;border:0;background:none;color:#666;font-size:10px;text-transform:uppercase;letter-spacing:.18em;gap:8px}
          .available i{width:6px;height:6px}
          .hero h1{font-size:clamp(72px,8.2vw,126px);line-height:.82;letter-spacing:-.075em;margin:28px 0 31px;max-width:900px;font-weight:900}
          .hero h1 .blue{color:var(--blue)}
          .lead{font-size:20px;line-height:1.35;color:#333;max-width:590px;margin:0 0 18px}
          .bio{font-size:13px;line-height:1.75;color:#777;max-width:560px}
          .actions{margin-top:34px;gap:10px}
          .btn{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:14px 18px;border-radius:0;border:1px solid #cfcfca;background:transparent}
          .btn.dark{background:#111;color:#fff;border-color:#111;box-shadow:none}
          .btn:hover{transform:none;letter-spacing:.12em}
          .explore{margin-top:65px}
          .explore label{font-size:8px;letter-spacing:.25em;margin-bottom:13px}
          .pills{gap:6px}
          .pill{font-size:10px;background:transparent;border:1px solid #d8d8d2;border-radius:999px;padding:8px 11px;color:#666}
          .visual{height:650px;position:relative;justify-content:center;align-items:center;margin:0;overflow:visible}
          .portrait-wrap{width:min(500px,100%);height:590px;position:relative;right:auto;top:auto;overflow:visible}
          .shape-a{width:67%;height:72%;right:4%;top:8%;background:#dcdcd7;clip-path:polygon(12% 0,100% 8%,86% 100%,0 89%);transform:rotate(-7deg);box-shadow:none}
          .shape-b{width:60%;height:66%;right:16%;bottom:4%;border:1px solid #c8c8c1;transform:rotate(6deg)}
          .portrait{width:92%;height:92%;right:4%;bottom:0;object-fit:contain;object-position:center bottom;filter:grayscale(.08) contrast(1.02);mix-blend-mode:multiply;mask-image:linear-gradient(to bottom,#000 88%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent 100%)}
          .float,.note,.scroll{display:none}
          .visual:after{content:'SCROLL / EXPLORE';position:absolute;right:-5px;bottom:70px;font-size:8px;letter-spacing:.25em;color:#888;writing-mode:vertical-rl}
          .stats{max-width:var(--max);border-block:1px solid var(--line);padding:0;grid-template-columns:repeat(4,1fr);background:transparent;margin-top:0}
          .stat{padding:25px 15px;text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:center}
          .stat strong{font-size:20px;letter-spacing:-.04em}.stat small{font-size:9px;text-transform:uppercase;letter-spacing:.12em;margin-top:5px}
          section{padding:150px 0;border-bottom:1px solid var(--line)}
          .section-top{grid-template-columns:48% 52%;gap:60px;margin-bottom:90px}
          .index{font-size:8px;letter-spacing:.25em;text-transform:uppercase}.index:after{width:35px;margin:0 12px 3px}
          .section-title{font-size:clamp(66px,8vw,116px);line-height:.83;letter-spacing:-.075em;margin:24px 0 0}
          .section-copy{font-size:14px;line-height:1.8;max-width:480px;margin-top:40px;color:#6f6f6b}
          .traits{grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);margin-top:80px}
          .trait{padding:25px 15px;text-align:left;border-right:1px solid var(--line)}.trait .icon{font-size:15px;margin-bottom:18px}.trait b{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.trait span{font-size:10px;margin-top:7px}
          #skills{background:#111;color:#f4f4ef;border-bottom-color:#292929}
          #skills .index,#skills .section-copy,#skills .skill-group h3{color:#8e8e88}
          #skills .index:after{background:#555}
          #skills .section-title .blue{color:#5d9cff}
          .skills-layout{grid-template-columns:28% 72%;gap:90px}
          .skill-group{border-top:1px solid #333;padding:25px 0}.skill-group h3{font-size:9px;text-transform:uppercase;letter-spacing:.2em;margin-bottom:17px}
          .chips{gap:7px}.chip{font-size:11px;background:#181818;color:#ddd;border:1px solid #343434;border-radius:0;padding:10px 13px}.chip:hover{background:#fff;color:#111;box-shadow:none;transform:none}
          #projects{padding-top:160px}
          #projects .projects-head{margin-bottom:80px}
          .project{grid-template-columns:90px minmax(0,1fr) 115px;gap:30px;padding:42px 0;border-top:1px solid var(--line);transition:padding .35s,background .35s}
          .project:hover{padding:42px 18px;background:#ecece7}
          .num{font-size:10px;letter-spacing:.2em}.project h3{font-size:clamp(25px,3vw,45px);letter-spacing:-.055em;margin:0 0 10px}.status{font-size:9px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:25px;color:var(--blue)}
          .desc{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 45px;max-width:900px;font-size:12px;line-height:1.65}.desc div:before{content:'+';margin-right:7px;color:#888}.stackline{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-top:25px}.project-links{flex-direction:column;align-items:flex-end}.project-links a{font-size:9px;text-transform:uppercase;letter-spacing:.08em;border:0;border-bottom:1px solid #aaa;border-radius:0;padding:7px 0}.project-links a:first-child{background:none;color:#111;border-color:#111}
          #experience,#education{background:#e9e9e4}
          .timeline{max-width:none}.row{grid-template-columns:220px 1fr;gap:70px;padding:36px 0;border-top:1px solid #cfcfc9}.year{font-size:9px;text-transform:uppercase;letter-spacing:.18em}.row h3{font-size:25px;letter-spacing:-.035em}.row .org{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin:7px 0 13px}.row p{font-size:12px;max-width:650px;color:#777}
          #contact{background:#111;color:#f5f5ef;border-bottom:0;padding-bottom:95px}#contact .index,#contact .section-copy{color:#92928b}#contact .index:after{background:#555}#contact .section-title .blue{color:#5d9cff}.contact-box{grid-template-columns:1fr 1fr;gap:90px;align-items:end}.contact-box h2{font-size:clamp(80px,10vw,150px);letter-spacing:-.08em}.contact-box p{font-size:13px;color:#aaa;line-height:1.8}.contact-links{gap:18px}.contact-links a{padding:0 0 7px;border:0;border-bottom:1px solid #555;border-radius:0;background:none;color:#eee;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.footer{padding:28px 0;border-top:1px solid #333;background:#111;color:#777;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
          #top{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;border:1px solid #444}
          .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}.reveal.in{opacity:1;transform:none}
          .cursor-dot{position:fixed;width:7px;height:7px;border-radius:50%;background:#111;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;transition:transform .12s ease}
          @media(max-width:1050px){.page{width:calc(100% - 60px)}.hero{grid-template-columns:1fr .9fr;gap:25px}.hero h1{font-size:clamp(62px,8vw,92px)}.visual{height:590px}.portrait-wrap{width:430px;height:540px}.section-top{grid-template-columns:45% 55%;gap:35px}.section-title{font-size:clamp(58px,8vw,92px)}.skills-layout{gap:45px}}
          @media(max-width:820px){.page{width:calc(100% - 36px)}nav{height:70px}.links{display:none}.connect{padding:11px 13px}.hero{display:flex;flex-direction:column;padding-top:70px;min-height:auto;gap:0}.visual{order:-1;width:100%;height:480px}.portrait-wrap{width:390px;height:450px}.copy{padding:50px 0 70px}.hero h1{font-size:clamp(65px,17vw,105px)}.lead{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.section-top,.skills-layout,.contact-box{display:block}.section-copy{margin-top:35px}.traits{grid-template-columns:repeat(2,1fr)}.trait:nth-child(2){border-right:0}.skills-layout>div:last-child{margin-top:20px}.project{grid-template-columns:55px 1fr;gap:18px}.project-links{grid-column:2;flex-direction:row;align-items:flex-start}.desc{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:12px}.contact-box h2{margin-bottom:45px}}
          @media(max-width:560px){.page{width:calc(100% - 28px)}.logo{font-size:20px}.connect{font-size:9px}.hero h1{font-size:clamp(58px,17vw,84px)}.visual{height:400px}.portrait-wrap{width:320px;height:380px}.section-title{font-size:clamp(55px,17vw,78px)}section{padding:105px 0}.traits{margin-top:55px}.project{padding:30px 0}.project:hover{padding:30px 8px}.contact-box h2{font-size:clamp(65px,20vw,100px)}}
          @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.cursor-dot{display:none}}
          '''
          marker='</style>'
          if 'ART-DIRECTION REDESIGN — editorial, minimal, interaction-led' not in s:
              s=s.replace(marker,css+'\n'+marker,1)
          js=r'''
          <script>
          (()=>{
            document.querySelectorAll('main section,.stats,.project,.trait,.skill-group,.row,.contact-box').forEach(el=>el.classList.add('reveal'));
            const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
            document.querySelectorAll('.reveal').forEach(e=>io.observe(e));
            if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
              const dot=document.createElement('div');dot.className='cursor-dot';document.body.appendChild(dot);
              addEventListener('mousemove',e=>{dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px'});
              document.querySelectorAll('.btn,.connect,.project-links a,.chip').forEach(el=>el.addEventListener('mouseenter',()=>dot.style.transform='translate(-50%,-50%) scale(3)'));
              document.querySelectorAll('.btn,.connect,.project-links a,.chip').forEach(el=>el.addEventListener('mouseleave',()=>dot.style.transform='translate(-50%,-50%) scale(1)'));
            }
            const portrait=document.getElementById('portrait');
            if(portrait) portrait.style.transform='none';
          })();
          </script>
          '''
          if 'cursor-dot' not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/redesign-awwwards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/redesign-awwwards.yml
          git commit -m 'Apply Arturo-inspired portfolio redesign'
          git push
