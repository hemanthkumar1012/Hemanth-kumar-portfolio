name: Update project live links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://github.com/hemanthkumar1012/parcelpilot-platform', 'https://github.com/hemanthkumar1012/parcelpilot-platform')
          s = s.replace('https://github.com/hemanthkumar1012/llm-evaluation-lab', 'https://github.com/hemanthkumar1012/llm-evaluation-lab')
          # Add live buttons immediately before the existing GitHub button for each project.
          s = s.replace('<a href="https://github.com/hemanthkumar1012/parcelpilot-platform" target="_blank">GitHub ↗</a>', '<a href="https://parcelpilot-platform.vercel.app/" target="_blank">Live ↗</a><a href="https://github.com/hemanthkumar1012/parcelpilot-platform" target="_blank">GitHub ↗</a>', 1)
          s = s.replace('<a href="https://github.com/hemanthkumar1012/llm-evaluation-lab" target="_blank">GitHub ↗</a>', '<a href="https://llmevallab-klar2hzi.manus.space/" target="_blank">Live ↗</a><a href="https://github.com/hemanthkumar1012/llm-evaluation-lab" target="_blank">GitHub ↗</a>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/update-live-links.yml
          git commit -m 'Add live demos for ParcelPilot and LLM Evaluation Lab'
          git push
