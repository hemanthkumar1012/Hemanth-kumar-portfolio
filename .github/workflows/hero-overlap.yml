name: Refine hero overlap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: github.event.head_commit.message != 'Apply unique hero overlap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unique overlapping composition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* UNIQUE HERO OVERLAP — reference-inspired composition */
          .hero{position:relative;grid-template-columns:43% 57%;min-height:860px;overflow:visible}
          .copy{position:relative;z-index:12}
          .visual{position:relative;height:825px;overflow:visible;justify-content:flex-start;align-items:flex-start;margin-left:-90px;z-index:3}
          .portrait-wrap{position:relative;width:880px;height:850px;right:auto;top:-12px;overflow:visible}
          .shape-a{width:59%;height:66%;right:10%;top:11%;z-index:0;background:#d9d9d6;transform:rotate(-7deg)}
          .shape-b{width:53%;height:62%;right:21%;bottom:10%;z-index:0;transform:rotate(8deg)}
          .portrait{z-index:3;width:118%;height:118%;right:-12%;bottom:-12%;object-fit:contain;object-position:center bottom;mix-blend-mode:multiply;filter:drop-shadow(0 35px 35px rgba(0,0,0,.16));mask-image:radial-gradient(ellipse 63% 72% at 55% 46%,#000 56%,rgba(0,0,0,.94) 70%,transparent 98%);-webkit-mask-image:radial-gradient(ellipse 63% 72% at 55% 46%,#000 56%,rgba(0,0,0,.94) 70%,transparent 98%);transition:transform .18s ease}
          .terminal{z-index:20;left:13%;bottom:10%;min-width:330px;transform:translate(-12px,8px) rotate(-1.5deg)}
          .benefits{z-index:21;right:3%;bottom:17%;transform:rotate(1.5deg)}
          .note.one{z-index:22;right:4%;top:13%}
          .note.two{z-index:22;left:-4%;top:50%}
          .scroll{z-index:22;right:-2%;bottom:103px}
          .stats{position:relative;z-index:30;margin-top:-18px;background:linear-gradient(to bottom,rgba(248,248,245,.15),var(--bg) 32%);backdrop-filter:blur(2px)}
          @media(max-width:1050px){.hero{grid-template-columns:44% 56%;min-height:820px}.visual{height:760px;margin-left:-65px}.portrait-wrap{width:790px;height:790px}.portrait{width:118%;height:118%}}
          @media(max-width:820px){.hero{grid-template-columns:1fr;min-height:auto}.visual{order:-1;height:600px;margin-left:0;justify-content:center}.portrait-wrap{width:680px;max-width:125%;height:610px;right:auto;top:0}.portrait{width:110%;height:110%;right:-5%;bottom:-6%}.terminal{left:7%;bottom:8%}.benefits{right:3%;bottom:17%}.stats{margin-top:0}}
          @media(max-width:560px){.visual{height:490px}.portrait-wrap{width:550px;height:490px;max-width:135%}.portrait{width:112%;height:112%;right:-6%;bottom:-6%}.terminal{left:1%;bottom:7%;min-width:225px}.benefits{right:-2%;bottom:16%;min-width:138px}.note.two{left:0}.note.one{right:0}}
          '''
          marker='</style>'
          if '/* UNIQUE HERO OVERLAP — reference-inspired composition */' not in s:
              s=s.replace(marker,css+'\\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/hero-overlap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/hero-overlap.yml
          git commit -m 'Apply unique hero overlap'
          git push
