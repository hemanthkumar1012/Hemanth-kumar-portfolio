name: Tune reference layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tune:
    if: github.event.head_commit.message != 'Apply reference portfolio layout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference layout overrides
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = r'''
          /* REFERENCE MATCH — hero composition */
          .page{width:min(1215px,calc(100% - 112px))}
          nav{height:78px;background:rgba(248,248,245,.88)}
          .nav{max-width:1215px}
          .logo{font-size:28px;letter-spacing:-3px}
          .links{gap:34px;margin-left:70px}
          .links a{font-size:14px}
          .connect{padding:14px 22px;font-size:13px}
          .hero{min-height:840px;padding-top:78px;grid-template-columns:45% 55%;align-items:stretch}
          .copy{padding:88px 0 38px;display:flex;flex-direction:column;justify-content:flex-start}
          .available{font-size:13px;padding:8px 15px;width:max-content}
          .hero h1{font-size:clamp(64px,5.75vw,82px);line-height:.93;letter-spacing:-5px;margin:22px 0 18px;max-width:630px}
          .lead{font-size:20px;max-width:610px;margin-bottom:18px}
          .bio{font-size:15px;line-height:1.55;max-width:570px}
          .actions{margin-top:27px}
          .btn{padding:14px 23px}
          .explore{margin-top:74px}
          .explore label{font-size:9px;letter-spacing:3px}
          .pill{font-size:11px;padding:8px 13px}
          .visual{height:790px;overflow:visible;justify-content:flex-end;align-items:flex-start}
          .portrait-wrap{width:760px;height:790px;right:-55px;top:-18px}
          .shape-a{width:63%;height:68%;right:5%;top:11%;background:#dcdcd9;transform:rotate(-7deg)}
          .shape-b{width:55%;height:65%;right:18%;bottom:8%;transform:rotate(8deg)}
          .portrait{width:108%;height:108%;right:-7%;bottom:-7%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 28px 30px rgba(0,0,0,.14));mix-blend-mode:multiply}
          .terminal{left:9%;bottom:9%;min-width:320px;padding:14px 18px}
          .benefits{right:1%;bottom:16%;min-width:178px;padding:10px 16px}
          .note.one{right:4%;top:14%;font-size:18px}
          .note.two{left:-3%;top:50%;font-size:18px}
          .scroll{right:-15px;bottom:100px}
          .stats{max-width:1215px;margin:auto;padding:23px 0}
          .stat strong{font-size:20px}
          .stat small{font-size:12px}
          section{padding:112px 0}
          .section-top{margin-bottom:54px}
          .section-title{font-size:clamp(58px,6.4vw,88px)}
          @media(max-width:1050px){.page{width:calc(100% - 60px)}.hero{grid-template-columns:44% 56%}.hero h1{font-size:clamp(58px,6.4vw,76px)}.visual{height:700px}.portrait-wrap{width:690px;height:700px;right:-60px}}
          @media(max-width:820px){.page{width:calc(100% - 40px)}.hero{grid-template-columns:1fr;min-height:auto}.copy{padding:55px 0 15px}.visual{height:590px;order:-1}.portrait-wrap{width:620px;max-width:120%;height:590px;right:-10%;top:0}.portrait{width:105%;height:105%;right:-5%;bottom:-5%}.explore{margin-top:43px}}
          @media(max-width:560px){.hero h1{font-size:clamp(56px,15vw,82px);letter-spacing:-4px}.portrait-wrap{width:520px;height:475px;right:-18%}.visual{height:475px}.explore{margin-top:43px}}
          '''
          marker='</style>'
          if '/* REFERENCE MATCH — hero composition */' not in s:
              s=s.replace(marker,css+'\n'+marker,1)
          # Match the reference navigation: Education remains a section but is not in the top nav.
          s=s.replace('<a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a>','<a href="#experience">Experience</a><a href="#contact">Contact</a>')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/tune-reference-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/tune-reference-layout.yml
          git commit -m 'Apply reference portfolio layout'
          git push
