name: Finalize portrait
on:
  push:
    paths:
      - '.github/workflows/finalize-portrait.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install actual portrait
        env:
          PORTRAIT_B64: ""
      - name: Build asset and clean workflows
        run: |
          printf '%s' "$PORTRAIT_B64" | base64 -d > assets/portrait.jpg
          rm -f .github/workflows/fix-portrait.yml .github/workflows/finalize-portrait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/portrait.jpg .github/workflows/fix-portrait.yml .github/workflows/finalize-portrait.yml
          git commit -m 'Use uploaded portrait in integrated 3D hero'
          git push
