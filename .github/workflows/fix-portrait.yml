name: Fix portrait asset
on:
  push:
    paths:
      - '.github/workflows/fix-portrait.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject portrait
        env:
          PORTRAIT_B64: ""
          FILE_PATH="portrait.jpg"
      - name: Replace placeholder
        run: |
          printf '%s' "$PORTRAIT_B64" | base64 -d > "$FILE_PATH"
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('data:image/jpeg;base64,USER_PORTRAIT_BASE64_PLACEHOLDER','assets/portrait.jpg')
          p.write_text(s)
          PY
          mkdir -p assets
          mv portrait.jpg assets/portrait.jpg
          rm -f .github/workflows/fix-portrait.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/portrait.jpg .github/workflows/fix-portrait.yml
          git commit -m 'Integrate Hemanth portrait into 3D hero' || exit 0
          git push
